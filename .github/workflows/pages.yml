name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GITHUB_USERNAME: mauromolina
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Resolve site URL and base path
        run: |
          SITE_URL="${{ steps.pages.outputs.base_url }}"
          SITE_URL="${SITE_URL%/}"
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          BASE_PATH="${BASE_PATH%/}"
          if [ "$BASE_PATH" = "/" ]; then BASE_PATH=""; fi
          echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "SITE_URL=$SITE_URL"
          echo "BASE_PATH=$BASE_PATH"

      - name: Write robots.txt and sitemap.xml
        run: |
          cat > public/robots.txt <<EOF
          User-agent: *
          Allow: /

          Sitemap: ${NEXT_PUBLIC_SITE_URL}/sitemap.xml
          EOF
          cat > public/sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>${NEXT_PUBLIC_SITE_URL}/</loc>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - run: npm ci
      - run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
